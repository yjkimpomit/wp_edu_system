<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>UI 컴포넌트 | 기동정지절차교육평가시스템</title>
	<link rel="stylesheet" href="/resources/user/css/user.css">
	<link rel="stylesheet" href="/resources/user/css/components.css">
	<link rel="stylesheet" href="/resources/user/css/component-guide.css">
</head>

<body>
	<main>
		<h1>UI 컴포넌트</h1>
		<section aria-labelledby="buttons-title">
			<h2 id="buttons-title">Button</h2>
			<figure data-button-grid aria-label="버튼 스타일과 크기 및 상태"></figure>
			<p>크기: 36 / 40 / 32 / 48 · 상태: 기본 / Hover / 비활성</p>
		</section>
		<section aria-labelledby="group-title">
			<h2 id="group-title">Button Group</h2>
			<div class="btn-group" role="group" aria-label="편집 작업"><button class="btn btn-primary btn-md"
					type="button">저장</button><button class="btn btn-neutral btn-md" type="button">취소</button><button
					class="btn btn-danger btn-md" type="button">삭제</button></div>
		</section>
		<section aria-labelledby="icons-title">
			<h2 id="icons-title">Icon Button</h2>
			<figure data-icon-buttons aria-label="아이콘 버튼"></figure>
		</section>
		<section aria-labelledby="link-title">
			<h2 id="link-title">Link</h2>
			<p>더 자세한 내용을 보려면 링크를 클릭해 주세요. <a class="link" href="#forms-title">링크</a></p>
		</section>
		<section aria-labelledby="badges-title">
			<h2 id="badges-title">Badge</h2>
			<figure data-badges aria-label="배지 스타일과 크기"></figure>
		</section>
		<section aria-labelledby="scroll-title">
			<h2 id="scroll-title">Scrollbar</h2>
			<figure data-scrollbars>
				<div tabindex="0" role="region" aria-label="가로 스크롤 예시">
					<p>가로로 스크롤하여 콘텐츠를 확인하세요.</p>
				</div>
				<div tabindex="0" role="region" aria-label="세로 스크롤 예시">
					<p>세로로 스크롤하여 콘텐츠를 확인하세요.</p>
				</div>
			</figure>
		</section>
		<section aria-labelledby="forms-title">
			<h2 id="forms-title">Form</h2>
			<div data-forms>
				<figure>
					<fieldset>
						<legend class="visually-hidden">선택 입력 예시</legend><label><input type="radio" name="sample-choice"
								checked>라디오 버튼</label><label><input type="radio" name="sample-choice">라디오
							버튼</label><label><input type="checkbox" checked>체크박스</label><label><input
								type="checkbox">체크박스</label>
					</fieldset>
				</figure>
				<figure>
					<form aria-label="폼 컴포넌트 예시" onsubmit="return false">
						<label class="visually-hidden" for="text-sm">기본 텍스트</label><input class="form-control"
							id="text-sm" placeholder="플레이스 홀더">
						<div class="date-range"><label class="visually-hidden" for="start-sm">시작일</label><span class="form-icon" data-icon="calendar"><input
								class="form-control" id="start-sm" type="date" value="2026-10-09"></span><span
								aria-hidden="true">~</span><label class="visually-hidden" for="end-sm">종료일</label><span class="form-icon" data-icon="calendar"><input
								class="form-control" id="end-sm" type="date" value="2026-10-09"></span></div>
						<p>플레이스 홀더</p><label class="visually-hidden" for="select-sm">기본 선택</label><span class="form-icon" data-icon="keyboard-down"><select
							class="form-select" id="select-sm">
							<option>플레이스 홀더</option>
							<option>응시가능</option>
							<option>교육필요</option>
						</select></span>
						<label class="visually-hidden" for="disabled-sm">비활성 입력</label><input class="form-control"
							id="disabled-sm" placeholder="플레이스 홀더" disabled>
						<div class="form-checks"><label><input type="radio" name="inline-choice" checked>라디오
								버튼</label><label><input type="checkbox">체크박스</label></div>
						<label class="visually-hidden" for="memo">내용</label><textarea class="form-control" id="memo"
							placeholder="플레이스 홀더"></textarea>
						<label class="visually-hidden" for="file-sm">파일 선택</label><input class="form-control"
							id="file-sm" type="file">
						<label for="text-lg"><strong>레이블</strong></label><input class="form-control form-lg"
							id="text-lg" placeholder="플레이스 홀더">
						<div class="date-range"><label class="visually-hidden" for="start-lg">큰 시작일</label><span class="form-icon" data-icon="calendar"><input
								class="form-control form-lg" id="start-lg" type="date" value="2026-10-09"></span><span
								aria-hidden="true">~</span><label class="visually-hidden" for="end-lg">큰
								종료일</label><span class="form-icon" data-icon="calendar"><input class="form-control form-lg" id="end-lg" type="date"
								value="2026-10-09"></span></div>
						<label class="visually-hidden" for="disabled-lg">큰 비활성 입력</label><input
							class="form-control form-lg" id="disabled-lg" placeholder="플레이스 홀더" disabled>
						<label class="visually-hidden" for="select-lg">큰 선택</label><span class="form-icon" data-icon="keyboard-down"><select class="form-select form-lg"
							id="select-lg">
							<option>플레이스 홀더</option>
							<option>응시가능</option>
							<option>교육필요</option>
						</select></span>
						<label for="file-lg"><strong>레이블</strong></label><input class="form-control form-lg"
							id="file-lg" type="file">
					</form>
				</figure>
			</div>
		</section>
		<section aria-labelledby="filter-title">
			<h2 id="filter-title">Filter</h2>
			<form class="filter" id="filter-form">
				<div class="filter-fields">
				<div class="filter-group"><label for="filter-start">검색기간</label>
				<div class="date-range"><span class="form-icon" data-icon="calendar"><input class="form-control form-lg" id="filter-start" type="date"
						value="2026-10-09"></span><span aria-hidden="true">~</span><label class="visually-hidden"
						for="filter-end">검색 종료일</label><span class="form-icon" data-icon="calendar"><input class="form-control form-lg" id="filter-end" type="date"
						value="2026-10-09"></span></div></div>
				<div class="filter-group"><label for="filter-item">응시항목</label><span class="form-icon" data-icon="keyboard-down"><select
					class="form-select form-lg" id="filter-item">
					<option>#1-4 LP HTR In/Out VV Auto Open</option>
					<option>기동 절차</option>
					<option>정지 절차</option>
				</select></span></div>
				</div>
				<button class="btn btn-primary btn-lg" type="submit"
					data-icon="search"><span>검색</span></button>
			</form>
		</section>
		<section aria-labelledby="tabs-title">
			<h2 id="tabs-title">Tab</h2>
			<figure>
				<div class="tabs tabs-pills" data-tabs></div>
			</figure>
			<figure>
				<div class="tabs" data-tabs></div>
			</figure>
		</section>
	</main>
	<script>
		(() => {
			'use strict';
			const styles = ['primary', 'primary-default', 'primary-subtle', 'neutral', 'danger', 'success', 'warning', 'info'];
			document.querySelector('[data-button-grid]').innerHTML = styles.map(style => '<div>' + ['md', 'lg', 'sm', 'xl'].map(size => '<div>' + ['default', 'hover', 'disabled'].map(state => '<button type="button" data-icon="search" class="btn btn-' + style + ' btn-' + size + '"' + (state === 'disabled' ? ' disabled' : state === 'hover' ? ' data-preview="hover"' : '') + ' aria-label="' + style + ' ' + size + ' ' + state + '">' + '<span>버튼</span></button>').join('') + '</div>').join('') + '</div>').join('');
			document.querySelector('[data-icon-buttons]').innerHTML = ['primary', 'neutral', 'success', 'danger', 'warning', 'info', 'purple', 'plain'].map(style => '<button type="button" data-icon="hourglass" class="btn btn-icon btn-' + style + '" aria-label="' + style + ' 대기 시간">' + '</button>').join('');
			const badgeStyles = ['primary', 'neutral', 'success', 'danger', 'warning', 'info', 'purple'];
			document.querySelector('[data-badges]').innerHTML = ['', 'outlined'].map(type => badgeStyles.map(style => '<div>' + ['md', 'lg', 'xl'].map(size => '<span data-icon="lock" class="badge badge-' + style + ' badge-' + size + (type ? ' badge-' + type : '') + '">' + '<span>필요</span></span>').join('') + '</div>').join('')).join('') + '<div>' + ['md', 'lg', 'xl'].map(size => '<span data-icon="timer" class="badge badge-light badge-' + size + '">' + '<span>필요</span></span>').join('') + '</div><footer>' + badgeStyles.map(style => '<span class="badge badge-solid badge-' + style + '">오늘의 우선학습</span>').join('') + '</footer>';
			document.querySelectorAll('[data-tabs]').forEach((tabs, group) => {
				const labels = ['전체', '응시가능', '교육필요', '완료'];
				tabs.innerHTML = '<div role="tablist" aria-label="학습 상태 ' + (group + 1) + '">' + labels.map((label, index) => '<button type="button" class="nav-link' + (index === 0 ? ' active' : '') + '" id="tab-' + group + '-' + index + '" role="tab" aria-selected="' + (index === 0) + '" aria-controls="panel-' + group + '-' + index + '" tabindex="' + (index === 0 ? 0 : -1) + '">' + label + '</button>').join('') + '</div>' + labels.map((label, index) => '<div class="tab-pane' + (index === 0 ? ' active' : '') + '" id="panel-' + group + '-' + index + '" role="tabpanel" aria-labelledby="tab-' + group + '-' + index + '" tabindex="0"' + (index ? ' hidden' : '') + '>' + label + ' 학습 항목을 확인하세요.</div>').join('');
				const buttons = [...tabs.querySelectorAll('[role="tab"]')];
				const activate = button => buttons.forEach(item => { const selected = item === button; item.setAttribute('aria-selected', String(selected)); item.tabIndex = selected ? 0 : -1; item.classList.toggle('active', selected); const panel = document.getElementById(item.getAttribute('aria-controls')); panel.hidden = !selected; panel.classList.toggle('active', selected); });
				buttons.forEach((button, index) => { button.addEventListener('click', () => activate(button)); button.addEventListener('keydown', event => { let next; if (event.key === 'ArrowRight') next = (index + 1) % buttons.length; if (event.key === 'ArrowLeft') next = (index + buttons.length - 1) % buttons.length; if (event.key === 'Home') next = 0; if (event.key === 'End') next = buttons.length - 1; if (next !== undefined) { event.preventDefault(); activate(buttons[next]); buttons[next].focus(); } }); });
			});
			document.getElementById('filter-form').addEventListener('submit', event => event.preventDefault());
		})();
	</script>
</body>

</html>
